name: CI

# Run on every push to any branch, and on every PR. PR runs are what gives
# you a green/red check in the GitHub UI before merging; push runs catch
# anything pushed directly to a branch (e.g. via `git push` from this
# worktree) without a PR.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Next.js 16 requires >=20.9; pin to 22 to match local dev.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + production build
        # Next's build step also runs `tsc` under the hood, so this catches
        # type regressions in addition to bundling failures.
        # Dummy env vars so the build doesn't error on missing
        # NEXT_PUBLIC_* values; they're only read at runtime in the
        # browser, never baked into the build artifact in a way that
        # would matter here.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-dummy-maps-key
          # Marker values for every server-only secret. The next step fails
          # if any of them, or a real-looking key, lands in the browser bundle.
          SUPABASE_SERVICE_ROLE_KEY: CI_SECRET_MARKER_service_role
          RESEND_API_KEY: CI_SECRET_MARKER_resend
          CRON_SECRET: CI_SECRET_MARKER_cron
          GOOGLE_MAPS_SERVER_API_KEY: CI_SECRET_MARKER_maps_server
          REMINDER_FROM_EMAIL: CI_SECRET_MARKER_from
        run: npm run build

      - name: No server secret in the browser bundle
        # Only NEXT_PUBLIC_* values may reach .next/static. A secret named
        # with that prefix by mistake, or inlined some other way, fails here.
        run: |
          if grep -rqE "CI_SECRET_MARKER_|sk_(live|test)_[A-Za-z0-9]{8,}|re_[A-Za-z0-9]{20,}|service_role" .next/static; then
            echo "::error::A server-side secret is in the browser bundle:"
            grep -rnoE "CI_SECRET_MARKER_[a-z_]+|sk_(live|test)_[A-Za-z0-9]{8,}|re_[A-Za-z0-9]{20,}|service_role" .next/static | head
            exit 1
          fi
          echo "Browser bundle holds no server secret."

      - name: Unit tests
        run: npm run test:run
